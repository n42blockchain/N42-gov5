syntax = "proto3";
package sync_bp;
option go_package = "github.com/n42blockchain/N42/api/protocol/sync_pb";

import "types_pb/types.proto";

message HeadersByRangeRequest {
  types_pb.H256 startBlockNumber = 1;
  uint64 count = 2;
  uint64 step = 3;
}

// Ping is used to check peer liveness and measure latency
message Ping {
  uint64 seq_number = 1;
}

//v2 - eth/69 compatible Status message
message Status {
  //  string version = 1;
  uint32 protocolVersion = 1;  // eth protocol version (68 or 69)
  uint64 networkID = 2;         // network identifier (mainnet=1, etc.)
  types_pb.H256 genesisHash = 3;
  types_pb.H256 currentHeight = 4;  // Latest block number for backward compatibility

  // eth/69 specific fields - block range information
  uint64 earliestBlock = 5;     // Earliest available block number
  uint64 latestBlock = 6;       // Latest block number
  types_pb.H256 latestBlockHash = 7;  // Hash of latest block

  // Fork identification
  bytes forkID = 8;             // EIP-2124 fork identifier
}

// eth/69 BlockRangeUpdate message (0x11)
// Announces changes in the available block range
message BlockRangeUpdate {
  uint64 earliestBlock = 1;     // Earliest available block number
  uint64 latestBlock = 2;       // Latest block number
  types_pb.H256 latestBlockHash = 3;  // Hash of latest block
}

message ForkData {
  types_pb.H256 current_version = 1;
  types_pb.H256 genesis_validators_root = 2;
}

message BodiesByRangeRequest {
  types_pb.H256 startBlockNumber = 1;
  uint64 count = 2;
  uint64 step = 3;
}
