# golangci-lint v2 configuration; preserve the existing incremental lint gate.
version: "2"
run:
  timeout: 10m
  build-tags:
    - integration
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - staticcheck
    - unconvert
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - io.Copy
        - io.CopyBuffer
        - io.CopyN
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*database/sql.Rows).Close
        - (github.com/syndtr/goleveldb/leveldb.DB).Close
    gosec:
      excludes:
        - G104
        - G304
      severity: high
      confidence: high
      config:
        G306: "0644"
    govet:
      enable:
        - atomic
        - bools
        - buildtag
        - copylocks
        - httpresponse
        - loopclosure
        - lostcancel
        - nilfunc
        - printf
        - shift
        - stdmethods
        - structtag
        - tests
        - unmarshal
        - unreachable
        - unusedresult
      enable-all: false
    misspell:
      locale: US
      ignore-rules:
        - Initialised
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    staticcheck:
      checks:
        - all
        - -SA1019
        - -SA4006
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - prealloc
        path: _test\.go
      - linters:
          - all
        path: .*\.pb\.go
      - linters:
          - forbidigo
        path: cmd/
    paths:
      - .*_gen\.go$
      - .*\.pb\.go$
      - tests/eth-tests
      - vendor
      - third_party
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  # Existing lint debt remains outside this patch gate.
  new: true
severity:
  default: warning
  rules:
    - linters:
        - gosec
      severity: error
    - linters:
        - govet
      severity: error
    - linters:
        - errcheck
      severity: warning
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/n42blockchain/N42
  exclusions:
    generated: lax
    paths:
      - .*_gen\.go$
      - .*\.pb\.go$
      - tests/eth-tests
      - vendor
      - third_party
      - third_party$
      - builtin$
      - examples$
