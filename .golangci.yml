# golangci-lint configuration for N42 Blockchain
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 10m
  tests: true
  build-tags:
    - integration

output:
  formats:
    - format: colored-line-number
      path: stdout
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  disable-all: true
  enable:
    # Security
    - gosec

    # Bugs
    - govet
    - staticcheck
    - errcheck
    - ineffassign

    # Code quality
    - unconvert
    - misspell
    - gofmt
    - goimports

    # Performance
    - prealloc

linters-settings:
  gosec:
    severity: high
    confidence: high
    excludes:
      - G104  # Audit errors not checked (too many false positives)
      - G304  # File path provided as taint input (intentional in CLI)
    config:
      G306: "0644"  # Expect WriteFile permissions to be 0644

  govet:
    enable-all: false
    enable:
      - atomic
      - bools
      - buildtag
      - copylocks
      - httpresponse
      - loopclosure
      - lostcancel
      - nilfunc
      - printf
      - shift
      - stdmethods
      - structtag
      - tests
      - unmarshal
      - unreachable
      - unusedresult

  staticcheck:
    checks:
      - all
      - '-SA1019'  # Deprecated (too noisy during refactoring)
      - '-SA4006'  # Value assigned but never used (context-dependent)

  errcheck:
    check-type-assertions: false
    check-blank: false
    exclude-functions:
      - io.Copy
      - io.CopyBuffer
      - io.CopyN
      - (io.Closer).Close
      - (*os.File).Close
      - (net.Conn).Close
      - (*database/sql.Rows).Close
      - (github.com/syndtr/goleveldb/leveldb.DB).Close

  misspell:
    locale: US
    ignore-words:
      - Initialised

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/n42blockchain/N42

  prealloc:
    simple: true
    range-loops: true
    for-loops: false

issues:
  exclude-dirs:
    - tests/eth-tests
    - vendor
    - third_party
  exclude-files:
    - ".*_gen\\.go$"
    - ".*\\.pb\\.go$"
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - prealloc

    # Exclude known issues in generated files
    - path: ".*\\.pb\\.go"
      linters:
        - all

    # Allow fmt.Print* in cmd packages
    - path: cmd/
      linters:
        - forbidigo

  max-issues-per-linter: 50
  max-same-issues: 10
  # This repository carries significant historical lint debt. Gate regressions
  # in the current patch instead of blocking all work on unrelated legacy issues.
  new: true

severity:
  default-severity: warning
  rules:
    - linters:
        - gosec
      severity: error
    - linters:
        - govet
      severity: error
    - linters:
        - errcheck
      severity: warning
